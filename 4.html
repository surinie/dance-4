<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png" type="image/png">
<title>dance</title>

<style>
  :root {
    --red: #FF3511;
    --font-serif: 'Source Serif 4', 'Pretendard Variable', Pretendard, serif;
    --font-sans: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    position: relative;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  button {
    font: inherit;
    border: 0;
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;       /* 가운데정렬 (양끝정렬 아님) */
    text-align-last: center;
    text-justify: auto;
  }

  /* ══ 화면(screen) 단위 전환 ══════════════════════ */
  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .screen[hidden] { display: none !important; }

  /* ══ Screen 1 : 영상 ═════════════════════════════ */
  #screen-1 { background: #000; }

  .video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* 인터랙션 캔버스 (영상 위, UI 아래) */
  .fx {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    touch-action: none;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 좌측 세로 타이틀 (아래 → 위로 읽힘) */
  .chapter-title {
    position: absolute;
    top: 496px;
    left: 78px;
    z-index: 2;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 88px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--red);
    white-space: nowrap;
    writing-mode: vertical-rl;
    transform: translateY(-50%) rotate(180deg);   /* 글자 수와 관계없이 세로 중앙 */
    pointer-events: none;
  }

  /* 우측 상단 일시정지 버튼 */
  .pause-btn {
    position: absolute;
    top: 36px;
    right: 40px;
    z-index: 2;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
  }
  .pause-btn i {
    display: block;
    width: 10px;
    height: 34px;
    border-radius: 0;
    background: #fff;
  }

  /* 하단 진행바 */
  .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 28px;
    z-index: 2;
    background: rgba(255, 255, 255, 0.5);   /* 아직 재생되지 않은 구간 */
    pointer-events: none;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    background: #fff;   /* 불투명도 100 */
  }

  /* ══ Screen 2 : 결과(프레임 선택) 화면 ═══════════
     기준 화면 1728 × 977px — 레퍼런스(1728×1117) 비율 그대로 0.8747배 */
  #screen-2 { background: #fff; }

  .result-main {
    position: absolute;
    top: 77px;
    left: 153px;
    width: 964px;
    height: 623px;
    background: #D9D9D9;
    display: block;
  }

  .thumb {
    position: absolute;
    top: 753px;
    width: 226px;
    height: 146px;
    padding: 0;
    background: #D9D9D9;
    display: block;
  }
  .thumb canvas { display: block; width: 100%; height: 100%; }
  .thumb.sel { outline: 3px solid var(--red); outline-offset: 0; }
  .t1 { left: 153px; }
  .t2 { left: 399px; }
  .t3 { left: 645px; }
  .t4 { left: 891px; }

  .opt-label {
    position: absolute;
    left: 1187px;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 26px;
    line-height: 37px;
    color: #000;
  }
  .opt-value {
    position: absolute;
    left: 1350px;
    width: 140px;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 23px;
    line-height: 37px;
    color: #000;
    text-align: center;
  }
  .arrow {
    position: absolute;
    width: 32px;
    height: 37px;
    padding: 0;
    background: var(--red);
  }
  .arrow-l { left: 1316px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .arrow-r { left: 1492px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .row-title { top: 122px; }
  .row-date  { top: 243px; }

  /* 이미지 다시 뽑기 줄 : 라벨 + 우측 버튼 (title·date 줄 아래) */
  .row-redraw {
    position: absolute;
    left: 1187px;
    top: 364px;
    display: flex;
    align-items: center;
    gap: 22px;
    height: 37px;
  }
  .row-redraw .opt-label { position: static; white-space: nowrap; }
  .redraw-btn {
    flex: none;
    height: 37px;
    padding: 0 20px;
    border-radius: 19px;
    background: var(--red);
    color: #fff;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 20px;
    line-height: 1;
    white-space: nowrap;
  }

  .round {
    position: absolute;
    top: 781px;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 22px;
    line-height: 1.25;
    border: 1.5px solid var(--red);
  }
  .round-save  { left: 1308px; background: #fff; color: var(--red); }
  .round-other { left: 1457px; background: var(--red); color: #fff; }

  /* ══ 오버레이 + 팝업 ═════════════════════════════ */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.4);
    display: none;
  }
  .overlay.on { display: block; }

  .popup {
    position: fixed;
    z-index: 11;
    flex: none;
    /* 기준 화면(1728×1117)의 중앙 위치에 고정.
       창이 더 작아져도 팝업은 밀리지 않고 창 경계에서 함께 잘림.
       창이 더 커지면 화면 중앙을 유지. */
    left: max(calc((1728px - var(--pw)) / 2), calc(50vw - var(--pw) / 2));
    top:  max(calc((1117px - var(--ph)) / 2), calc(50vh - var(--ph) / 2));
    display: none;
  }
  .popup.on { display: block; }

  /* 팝업 1 : 안내 */
  .popup-intro {
    /* 안내 팝업은 항상 화면 정중앙 */
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 824px;
    height: 369px;
    background: var(--red);
  }
  .popup-intro .popup-text {
    position: absolute;
    top: 49px;
    left: 40px;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 26px;
    line-height: 43px;
    color: #fff;
    white-space: nowrap;
  }
  .popup-intro .btn-start {
    position: absolute;
    top: 172px;
    left: 620px;
    width: 173px;
    height: 173px;
    border-radius: 50%;
    background: #fff;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 32px;
    line-height: 1.15;
    color: var(--red);
    text-align: center;
  }

  /* 팝업 2 / 4 : 선택 (배경 사각형 없이 원 3개만) */
  .popup-choice {
    --pw: 828px;
    --ph: 230px;
    width: 828px;
    height: 230px;
    background: none;
  }
  .popup-choice .opt {
    position: absolute;
    top: -100px;
    flex: none;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: #fff;
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 28px;
    line-height: 1;
    color: var(--red);
    white-space: nowrap;
  }
  .popup-choice .opt-primary {
    background: var(--red);
    color: #fff;
  }

  /* 팝업 2 배치: 나가기 | 계속 추기(빨강) | 다시 추기 */
  #popup-pause .o-exit     { left: 0; }
  #popup-pause .o-continue { left: 299px; }
  #popup-pause .o-restart  { left: 598px; }

  /* 팝업 4 배치: 나가기 | 다시 추기 | 다음(빨강) */
  #popup-end .o-exit    { left: 0; }
  #popup-end .o-restart { left: 299px; }
  #popup-end .o-next    { left: 598px; }
</style>
</head>
<body>

  <!-- ══ Screen 1 ══ -->
  <section class="screen" id="screen-1">
    <video class="video" id="video" src="mp4.mp4" preload="auto" playsinline></video>
    <canvas class="fx" id="cv"></canvas>

    <h1 class="chapter-title">audition</h1>

    <button class="pause-btn" id="btn-pause" aria-label="일시정지"><i></i><i></i></button>

    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
  </section>

  <!-- ══ Screen 2 : 결과 ══ -->
  <section class="screen" id="screen-2" hidden>
    <canvas class="result-main" id="result-main"></canvas>

    <button class="thumb t1" data-i="0"><canvas></canvas></button>
    <button class="thumb t2" data-i="1"><canvas></canvas></button>
    <button class="thumb t3" data-i="2"><canvas></canvas></button>
    <button class="thumb t4" data-i="3"><canvas></canvas></button>

    <span class="opt-label row-title">title</span>
    <button class="arrow arrow-l row-title" id="title-prev" aria-label="이전"></button>
    <span class="opt-value row-title" id="title-val">없음</span>
    <button class="arrow arrow-r row-title" id="title-next" aria-label="다음"></button>

    <span class="opt-label row-date">date</span>
    <button class="arrow arrow-l row-date" id="date-prev" aria-label="이전"></button>
    <span class="opt-value row-date" id="date-val">없음</span>
    <button class="arrow arrow-r row-date" id="date-next" aria-label="다음"></button>

    <div class="row-redraw">
      <span class="opt-label">이미지 다시 뽑기</span>
      <button class="redraw-btn" id="redraw-btn">1회 남음</button>
    </div>

    <button class="round round-save" id="btn-save">저장</button>
    <button class="round round-other" id="btn-other">다른 춤<br>추기</button>
  </section>

  <!-- ══ 오버레이 ══ -->
  <div class="overlay on" id="overlay"></div>

  <!-- 팝업 1 : 진입 안내 -->
  <div class="popup popup-intro on" id="popup-intro">
    <p class="popup-text">마우스를 놓는 순간 번개가 퍼져 나갑니다.<br>마우스를 누른 채로 오래 기다릴수록 큰<br>번개가 칩니다.</p>
    <button class="btn-start" id="btn-start"><span>Let’s<br>dance!</span></button>
  </div>

  <!-- 팝업 2 : 일시정지 -->
  <div class="popup popup-choice" id="popup-pause">
    <button class="opt o-exit" id="pause-exit">나가기</button>
    <button class="opt opt-primary o-continue" id="pause-continue">계속 추기</button>
    <button class="opt o-restart" id="pause-restart">다시 추기</button>
  </div>

  <!-- 팝업 4 : 영상 종료 -->
  <div class="popup popup-choice" id="popup-end">
    <button class="opt o-exit" id="end-exit">나가기</button>
    <button class="opt o-restart" id="end-restart">다시 추기</button>
    <button class="opt opt-primary o-next" id="end-next">다음</button>
  </div>

<script>
  const $ = id => document.getElementById(id);

  /* 챕터 메뉴(chapter.html)는 다른 저장소(dance)에 있으므로 절대 주소 사용 */
  const CHAPTER_URL = 'https://surinie.github.io/dance/chapter.html';

  const video   = $('video');
  const fill    = $('progress-fill');
  const overlay = $('overlay');
  const popups  = {
    intro: $('popup-intro'),
    pause: $('popup-pause'),
    end:   $('popup-end')
  };

  /* ── 팝업 열기 / 닫기 ── */
  function openPopup(name) {
    closePopups();
    overlay.classList.add('on');
    popups[name].classList.add('on');
  }
  function closePopups() {
    overlay.classList.remove('on');
    Object.values(popups).forEach(p => p.classList.remove('on'));
  }

  /* ── 재생 제어 ── */
  function play() {
    closePopups();
    const p = video.play();
    if (p && p.catch) p.catch(err => console.error('재생 실패:', err));
  }
  function restart() {
    clearFx();
    video.currentTime = 0;
    play();
  }

  /* ── 로드 오류 확인용 (F12 → Console) ── */
  video.addEventListener('error', () => {
    const e = video.error;
    console.error('video error code:', e && e.code, e && e.message);
    // 1 ABORTED / 2 NETWORK(경로·서버) / 3 DECODE(코덱·손상) / 4 SRC_NOT_SUPPORTED(코덱·형식·경로)
  });

  /* ── 진행바 ── */
  let raf = null;
  function updateProgress() {
    const d = video.duration;
    fill.style.width = d ? (video.currentTime / d * 100) + '%' : '0%';
  }
  function tick() {
    updateProgress();
    raf = requestAnimationFrame(tick);
  }
  video.addEventListener('play',  () => { cancelAnimationFrame(raf); tick(); });
  video.addEventListener('pause', () => { cancelAnimationFrame(raf); updateProgress(); });
  video.addEventListener('seeked', updateProgress);

  /* ── 영상 종료 → 팝업 4 ── */
  video.addEventListener('ended', () => {
    cancelAnimationFrame(raf);
    fill.style.width = '100%';
    openPopup('end');
  });


  /* ══ 인터랙션 (4 · audition) : 손을 떼는 순간 번개가 퍼짐 ═══ */
  const cv  = $('cv');
  const ctx = cv.getContext('2d');

  const COLORS    = ['#FFFFFF', '#FFF200', '#98FF08'];
  const TAU       = Math.PI * 2;
  const HOLD_FULL = 350;      // 생긴 직후 또렷하게 유지되는 시간(ms)
  const LIFE      = 2000;     // 생긴 뒤 완전히 사라지기까지(ms)
  const MAX_HOLD  = 1600;     // 이 시간 이상 누르면 최대 크기(ms)
  const MAX_SCALE = 6;        // 최대 크기 배율 (1 = 짧게 클릭)
  const BRANCHES  = [3, 5];   // 중심에서 뻗는 번개 줄기 수 (최소, 최대)
  const MAX_BOLTS = 14;
  const BOLT_W    = 10;        // 줄기 최대 굵기 기준(px) — 작을수록 얇음
  const BEND_W    = .17;       // 꺾이는 부분을 굵게 하는 정도 (0 = 없음, 클수록 꺾임 지점이 더 굵음)
  const TURN_P    = .78;      // 마디마다 꺾일 확률
  const TURN_MIN  = .5;      // 꺾이는 각도 범위(라디안): 최소 ~ 최대 (클수록 더 다이나믹)
  const TURN_MAX  = 1.15;
  const ZIGZAG    = .5;       // 직전과 반대쪽으로 꺾일 확률 (낮으면 같은 쪽으로 계속 휘어 큰 곡선, 높으면 지그재그)
  const MAX_SUBS  = 3;        // 번개 하나당 곁가지 최대 수
  const JITTER_PX = .8;         // 찌릿거리며 떨리는 정도(px, 크기에 비례해 커짐)
  const JITTER_MS = 90;       // 떨림 모양이 바뀌는 간격(ms)

  let W = 0, H = 0;
  let bolts = [];
  let press = null;           // 누르기 시작한 시각
  let vt = 0;                 // 재생 중에만 흐르는 가상 시계(ms)
  let lastReal = performance.now();

  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const isRunning = () => !video.paused && !video.ended;

  function clearFx() {
    bolts = []; press = null; frames = []; targets = []; picked = false; useB = false; rolled = false;
  }

  /* 지그재그 경로 → 굵기가 변하고 양 끝이 뾰족한 다각형 */
  function taperedPoly(pts, wmax) {
    const n = pts.length;
    const seg = [];
    let total = 0;
    for (let i = 1; i < n; i++) {
      const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      const l = Math.hypot(dx, dy) || 1;
      seg.push({ nx: -dy / l, ny: dx / l, l });
      total += l;
    }
    const L = [], R = [];
    let acc = 0;
    for (let i = 0; i < n; i++) {
      if (i > 0) acc += seg[i - 1].l;
      const t = acc / total;
      const w = wmax * Math.pow(1 - t, 1.6) * Math.min(1, t / .05 + .35);   // 시작이 가장 굵고 끝으로 갈수록 가늘어져 뾰족
      let nx, ny, m = 1, bw = 1;
      if (i === 0) { nx = seg[0].nx; ny = seg[0].ny; }
      else if (i === n - 1) { nx = seg[n - 2].nx; ny = seg[n - 2].ny; }
      else {
        nx = seg[i - 1].nx + seg[i].nx; ny = seg[i - 1].ny + seg[i].ny;
        const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        m = Math.min(1 / Math.max(.6, nx * seg[i].nx + ny * seg[i].ny), 1.6);      // 꺾인 모서리 보정
        bw = 1 + BEND_W * (1 - (seg[i - 1].nx * seg[i].nx + seg[i - 1].ny * seg[i].ny));   // 많이 꺾일수록 그 지점이 굵어짐
      }
      const h = w * m * bw / 2;
      L.push([pts[i][0] + nx * h, pts[i][1] + ny * h]);
      R.push([pts[i][0] - nx * h, pts[i][1] - ny * h]);
    }
    return L.concat(R.reverse());
  }

  /* 한 줄기: 중간점 분할(midpoint displacement)로 만든 불규칙한 번개 줄기 + 곁가지 */
  function jagged(x0, y0, x1, y1, rough, levels) {
    let pts = [[x0, y0], [x1, y1]];
    let disp = Math.hypot(x1 - x0, y1 - y0) * rough;
    for (let l = 0; l < levels; l++) {
      const out = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], c = pts[i];
        const dx = c[0] - a[0], dy = c[1] - a[1], len = Math.hypot(dx, dy) || 1;
        const off = (Math.random() * 2 - 1) * disp;
        out.push([(a[0] + c[0]) / 2 - dy / len * off, (a[1] + c[1]) / 2 + dx / len * off], c);
      }
      pts = out;
      disp *= .5;
    }
    return pts;
  }

  /* 방향이 큰 폭으로 바뀌며 나아가는 줄기: 한 번 꺾이면 원래 경로로 돌아오지 않고 새 방향으로 이어짐
     (지그재그로 번갈아 꺾이기도 하고, 같은 쪽으로 계속 휘기도 함) */
  function wander(x0, y0, ang, len, steps) {
    const pts = [[x0, y0]];
    let x = x0, y = y0, h = ang, lastSign = Math.random() < .5 ? -1 : 1;
    for (let i = 0; i < steps; i++) {
      const sl = len / steps * (.5 + Math.random() * 1.0);               // 마디 길이 불균일
      if (Math.random() < TURN_P) {
        const mag = TURN_MIN + Math.random() * (TURN_MAX - TURN_MIN);
        const sign = Math.random() < ZIGZAG ? -lastSign : lastSign;      // 반대쪽으로 번갈아 꺾기 vs 같은 쪽으로 계속 휘기
        h += sign * mag;
        lastSign = sign;
      }
      h += (ang - h) * .1;                                               // 전체 방향에서 너무 멀어지지 않게 아주 약하게 당김
      h = ang + Math.max(-1.5, Math.min(1.5, h - ang));
      x += Math.cos(h) * sl; y += Math.sin(h) * sl;
      pts.push([x, y]);
    }
    return pts;
  }

  function strokeBolt(x0, y0, ang, len, wmax, depth, out, st) {
    if (len < 26) return;                                  // 너무 짧은 가지는 만들지 않음 (잔 낙서처럼 보이는 것 방지)
    const steps = depth >= 2 ? 4 + Math.floor(Math.random() * 2) : depth ? 6 + Math.floor(Math.random() * 3) : 9 + Math.floor(Math.random() * 5);
    const pts = wander(x0, y0, ang, len * 1.15, steps);
    out.push({ pts, wmax });                               // 모양은 그릴 때 살짝 흔들어 다각형으로 변환
    if (depth >= 2) return;
    // 곁가지: 줄기 중간 지점에서 갈라져 나가 가늘고 짧음
    const n = pts.length;
    for (let i = Math.floor(n * .12); i < n * .8; i++) {
      if (st.subs >= MAX_SUBS || Math.random() > (depth ? .1 : .18)) continue;
      st.subs++;
      const dx = pts[Math.min(i + 2, n - 1)][0] - pts[Math.max(i - 2, 0)][0], dy = pts[Math.min(i + 2, n - 1)][1] - pts[Math.max(i - 2, 0)][1];
      const head = Math.atan2(dy, dx), dir = Math.random() < .5 ? -1 : 1;
      const remain = len * (1 - i / n);
      strokeBolt(pts[i][0], pts[i][1], head + dir * (.35 + Math.random() * .5), remain * (.3 + Math.random() * .3), wmax * .5, depth + 1, out, st);
    }
  }

  function makeBolt(scale) {
    const strokes = [];
    const st = { subs: 0 };
    const n = BRANCHES[0] + Math.floor(Math.random() * (BRANCHES[1] - BRANCHES[0] + 1));
    const a0 = Math.random() * TAU;
    const wmax = BOLT_W * Math.pow(scale, .45);
    for (let i = 0; i < n; i++) {
      const a = a0 + i * TAU / n + (Math.random() - .5) * .7;
      strokeBolt(0, 0, a, (130 + Math.random() * 85) * scale, wmax * (.6 + Math.random() * .7), 0, strokes, st);
    }
    return strokes;
  }

  function jitterPolys(b) {
    const amp = JITTER_PX * Math.pow(b.scale, .4);
    b.polys = b.strokes.map(s => taperedPoly(
      s.pts.map(p => [p[0] + (Math.random() - .5) * 2 * amp, p[1] + (Math.random() - .5) * 2 * amp]),
      s.wmax));
  }

  function releaseAt(x, y) {
    if (!press || !isRunning()) { press = null; return; }
    const h = Math.min(vt - press.t, MAX_HOLD);
    press = null;
    const scale = 1 + h / MAX_HOLD * (MAX_SCALE - 1);
    bolts.push({
      x, y, born: vt, scale, jit: -1e9, polys: [],
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      strokes: makeBolt(scale)
    });
    if (bolts.length > MAX_BOLTS) bolts.shift();
  }

  cv.addEventListener('pointerdown', e => {
    if (!isRunning()) return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    press = { t: vt };
  });
  cv.addEventListener('pointerup', e => releaseAt(e.clientX, e.clientY));
  cv.addEventListener('pointercancel', () => { press = null; });

  function drawBolt(b, alpha) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = b.color;
    for (const poly of b.polys) {
      ctx.beginPath();
      ctx.moveTo(poly[0][0], poly[0][1]);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function fxLoop(real) {
    const dt = Math.min((real - lastReal) / 1000, .033);
    lastReal = real;
    const running = isRunning();
    if (running) vt += dt * 1000;
    else press = null;                                       // 일시정지되면 누름 취소
    const now = vt;

    ctx.clearRect(0, 0, W, H);
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i], age = now - b.born;
      if (age > LIFE) { bolts.splice(i, 1); continue; }
      const alpha = age < HOLD_FULL ? 1 : 1 - (age - HOLD_FULL) / (LIFE - HOLD_FULL);
      if (now - b.jit >= JITTER_MS) { jitterPolys(b); b.jit = now; }   // 찌릿찌릿 떨림 (밝기는 그대로)
      drawBolt(b, alpha);
    }
    ctx.globalAlpha = 1;

    // 랜덤 타이밍 프레임 캡처 (번개가 그려진 직후)
    if (running && !picked) pickTargets();
    if (running && targets.length && video.currentTime >= targets[0]) {
      targets.shift();
      captureFrame();
    }
    requestAnimationFrame(fxLoop);
  }
  requestAnimationFrame(fxLoop);


  /* ══ 랜덤 타이밍 프레임 캡처 (영상 + 인터랙션, UI 제외) ══════════ */
  const SET_SIZE    = 4;                // 한 번에 보여줄 프레임 수
  const FRAME_COUNT = SET_SIZE * 2;     // 영상 재생 중 총 8장 캡처 (처음 4장 + 다시 뽑기용 4장)
  let frames  = [];     // 캡처된 canvas 8개 (짝수 번째 = 첫 세트, 홀수 번째 = 다시 뽑기 세트: 두 세트 모두 영상 전체에서 골고루)
  let targets = [];     // 캡처할 재생 시각(초), 오름차순

  let picked = false;   // 캡처 시점을 이미 정했는지
  function pickTargets() {
    const d = video.duration;
    if (!d || !isFinite(d)) return false;          // 영상 길이를 아직 모르면 나중에 다시 시도
    // 영상을 FRAME_COUNT 구간으로 나누고 구간마다 하나씩 무작위로 → 영상 전체에서 골고루, 최소 FRAME_COUNT장 확보
    const lo = d * .08, span = d * .84 / FRAME_COUNT;
    targets = Array.from({ length: FRAME_COUNT }, (_, i) => lo + span * (i + .1 + Math.random() * .8));
    picked = true;
    return true;
  }
  video.addEventListener('loadedmetadata', () => { if (!picked && !frames.length) pickTargets(); });
  video.addEventListener('play', () => { if (!picked && !frames.length) pickTargets(); });

  function captureFrame() {
    const c = document.createElement('canvas');
    const k0 = Math.min(1, 1920 / cv.width);            // 8장 보관: 가로 1920px 상한으로 메모리 절약
    c.width = Math.round(cv.width * k0); c.height = Math.round(cv.height * k0);
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      const k = Math.max(c.width / vw, c.height / vh);
      const dw = vw * k, dh = vh * k;
      g.drawImage(video, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);   // object-fit: cover 와 동일
    }
    g.drawImage(cv, 0, 0, c.width, c.height);                                                    // 인터랙션(번개)
    frames.push(c);
  }
  video.addEventListener('ended', () => {
    while (frames.length < FRAME_COUNT) captureFrame();   // 놓친 프레임 보충
  });

  /* ══ 결과 화면 ═══════════════════════════════════════════ */
  const BOX_W = 1102, BOX_H = 712;   // 합성용 설계 좌표 (표시는 896×579로 비율 축소)
  const POS = ['없음', '상단', '가운데', '하단'];
  let DATE_TEXT = '';
  function todayText() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
  }
  DATE_TEXT = todayText();
  const TITLE_LEFT = 3;                     // 제목 이미지 left (설계 좌표)
  const TITLE_TOP = [0, 17, 222, 500];       // 제목 이미지 top (미리보기 좌표)
  let selFrame = 0, titleIdx = 0, dateIdx = 0;
  let useB = false, rolled = false;     // 다시 뽑기: 현재 둘째 세트를 보는지 / 이미 한 번 뽑았는지
  const curFrames = () => frames.filter((_, i) => i % 2 === (useB ? 1 : 0));

  const titleImg = new Image();
  titleImg.onload = () => renderResult();
  titleImg.src = 'title.png';

  function coverDraw(g, src, w, h) {
    const k = Math.max(w / src.width, h / src.height);
    const dw = src.width * k, dh = src.height * k;
    g.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  // 프레임 + 제목 + 날짜를 canvas c에 합성 (미리보기·저장 공용)
  function compose(c, frame) {
    const g = c.getContext('2d');
    const k = c.width / BOX_W;
    g.clearRect(0, 0, c.width, c.height);
    g.fillStyle = '#D9D9D9'; g.fillRect(0, 0, c.width, c.height);
    if (frame) coverDraw(g, frame, c.width, c.height);

    if (titleIdx > 0 && titleImg.naturalWidth) {
      g.drawImage(titleImg, TITLE_LEFT * k, TITLE_TOP[titleIdx] * k, titleImg.naturalWidth * k, titleImg.naturalHeight * k);
    }
    if (dateIdx > 0) {
      g.save();
      g.fillStyle = '#fff';
      g.font = `500 ${16 * k}px "Pretendard Variable", Pretendard, sans-serif`;
      g.textBaseline = 'middle';
      const len = g.measureText(DATE_TEXT).width;
      const startY = dateIdx === 1 ? 20 * k + len
                   : dateIdx === 2 ? (BOX_H * k + len) / 2
                   :                 (BOX_H - 20) * k;
      g.translate(1065 * k, startY);
      g.rotate(-Math.PI / 2);                 // 아래 → 위로 읽힘
      g.fillText(DATE_TEXT, 0, 0);
      g.restore();
    }
  }

  const resMain = $('result-main');
  const thumbs  = [...document.querySelectorAll('.thumb')];

  function fitCanvas(c, w, h) {
    const d = Math.min(devicePixelRatio || 1, 2) * 2;
    c.width = w * d; c.height = h * d;
  }
  fitCanvas(resMain, 964, 623);
  thumbs.forEach(t => fitCanvas(t.firstElementChild, 226, 146));

  function renderResult() {
    const cf = curFrames();
    compose(resMain, cf[selFrame]);
    thumbs.forEach((t, i) => {
      const c = t.firstElementChild, g = c.getContext('2d');
      g.fillStyle = '#D9D9D9'; g.fillRect(0, 0, c.width, c.height);
      if (cf[i]) coverDraw(g, cf[i], c.width, c.height);
      t.classList.toggle('sel', i === selFrame);
    });
    $('title-val').textContent = POS[titleIdx];
    $('date-val').textContent  = POS[dateIdx];
    $('redraw-btn').textContent = !rolled ? '1회 남음' : (useB ? '이전 이미지로' : '다시 뽑은 이미지로');
  }
  function initResult() {
    DATE_TEXT = todayText();
    while (frames.length < FRAME_COUNT && video.videoWidth) captureFrame();
    selFrame = Math.min(selFrame, Math.max(curFrames().length - 1, 0));
    renderResult();
  }

  /* 이미지 다시 뽑기: 처음 한 번은 새 4장으로, 이후에는 두 세트를 오갈 수 있음 */
  $('redraw-btn').addEventListener('click', () => {
    if (!rolled) { rolled = true; useB = true; } else { useB = !useB; }
    renderResult();
  });
  thumbs.forEach(t => t.addEventListener('click', () => { selFrame = +t.dataset.i; renderResult(); }));
  const cycle = (v, d) => (v + d + POS.length) % POS.length;
  $('title-prev').addEventListener('click', () => { titleIdx = cycle(titleIdx, -1); renderResult(); });
  $('title-next').addEventListener('click', () => { titleIdx = cycle(titleIdx,  1); renderResult(); });
  $('date-prev').addEventListener('click',  () => { dateIdx  = cycle(dateIdx,  -1); renderResult(); });
  $('date-next').addEventListener('click',  () => { dateIdx  = cycle(dateIdx,   1); renderResult(); });

  /* 저장: 현재 큰 화면(프레임 + 제목 + 날짜)을 PNG로 */
  $('btn-save').addEventListener('click', async () => {
    const f = curFrames()[selFrame];
    if (!f) return;
    try { await document.fonts.ready; } catch (e) {}
    const c = document.createElement('canvas');
    c.width = f.width;
    c.height = Math.round(f.width * BOX_H / BOX_W);
    compose(c, f);
    try {
      c.toBlob(blob => {
        if (!blob) { alert('저장에 실패했습니다.'); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'billy-elliot-audition.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, 'image/png');
    } catch (err) {
      console.error(err);
      alert('보안 정책 때문에 저장할 수 없습니다.\nfile:// 이 아닌 로컬 서버(localhost)로 열어 주세요.');
    }
  });

  $('btn-other').addEventListener('click', () => { location.href = CHAPTER_URL; });

  /* ── 팝업 1 : 시작 ── */
  $('btn-start').addEventListener('click', play);

  /* ── 일시정지 버튼 → 팝업 2 ── */
  $('btn-pause').addEventListener('click', () => {
    video.pause();
    openPopup('pause');
  });

  /* ── 팝업 2 ── */
  $('pause-exit').addEventListener('click', () => { location.href = CHAPTER_URL; });
  $('pause-continue').addEventListener('click', play);
  $('pause-restart').addEventListener('click', restart);

  /* ── 팝업 4 ── */
  $('end-exit').addEventListener('click', () => { location.href = CHAPTER_URL; });
  $('end-restart').addEventListener('click', restart);
  $('end-next').addEventListener('click', () => showScreen('screen-2'));

  /* ── 같은 페이지 안에서 화면 전환 ── */
  function showScreen(id) {
    closePopups();
    video.pause();
    document.querySelectorAll('.screen').forEach(s => { s.hidden = (s.id !== id); });
    if (id === 'screen-2') initResult();
  }
</script>
</body>
</html>
